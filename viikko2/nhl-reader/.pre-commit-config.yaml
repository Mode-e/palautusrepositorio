repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        require_serial: true
        args:
          [
            "--rcfile=viikko2/nhl-reader/.pylintrc",
            "--init-hook=import sys; sys.path.extend(['viikko2/nhl-reader/src', 'viikko3/login/src', 'viikko4/verkkokauppa/src', 'viikko4/maksukortti-mock/src'])",
            "--disable=E1121,E0611,E1101,W0622,C0301,W0611,C0114,C0116,W0201,R0913,W0613,R1710,R0917",
          ]
