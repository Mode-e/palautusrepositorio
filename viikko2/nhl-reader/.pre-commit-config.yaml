repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        require_serial: true
        args:
          [
            "--rcfile=viikko2/nhl-reader/.pylintrc",
            "--init-hook=import sys; sys.path.extend(['viikko2/nhl-reader/src', 'viikko3/login/src'])",
          ]
